# Render Blueprint — Dashboard > New > Blueprint, point it at your repo.
services:
  - type: web
    name: minerprofit
    runtime: node
    # Free plan: sleeps after ~15 min idle, so the first call after a nap is slow.
    # Switch to "starter" (about $7/mo) once agents are using it.
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAY_TO              # Base wallet that receives USDC
        value: "0x3cBe74603889AD6Bfa3fa4285b43b4D6b8a33642"
      - key: X402_NETWORK        # base-sepolia for testing, base for real money
        value: base-sepolia
      - key: CDP_API_KEY_ID      # needed only for X402_NETWORK=base
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: PUBLIC_URL          # e.g. https://minerprofit.onrender.com (used in docs links)
        sync: false
      - key: COINGECKO_API_KEY   # optional free demo key, raises rate limits
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: FREE_CALLS_PER_DAY
        value: "25"
      - key: PRICE_PROFIT
        value: "$0.002"
      - key: PRICE_COMPARE
        value: "$0.005"
